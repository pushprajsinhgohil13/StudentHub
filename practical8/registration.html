    <!-- HEADER -->

        <div class="header-container">

            <div class="logo">
                <h2> StudentHub</h2>
            </div>

        </div>

    <!-- REGISTRATION FORM -->
    <main>

        <section class="hero">
            <h1>📝 Student Registration</h1>

            <p>
                Register your details for the StudentHub Portal.
            </p>
        </section>


        <section class="card">

            <h2 style="text-align:center;">
                Registration Form
            </h2>


            <!-- IMPORTANT:
                 method = POST
                 action = process.php
            -->

            <form action="process.php" method="POST">

                <!-- NAME -->
                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >


                <!-- EMAIL -->
                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="example@gmail.com"
                    required
                >


                <!-- PHONE -->
                <label for="phone">
                    Phone Number
                </label>

                <input
                    type="text"
                    id="phone"
                    name="phone"
                    placeholder="Enter 10 digit phone number"
                    maxlength="10"
                    required
                >


                <!-- COURSE -->
                <label for="course">
                    Course
                </label>

                <select
                    id="course"
                    name="course"
                    required
                >

                    <option value="">
                        Select Course
                    </option>

                    <option value="B.Tech CSE">
                        B.Tech CSE
                    </option>

                    <option value="B.Tech IT">
                        B.Tech IT
                    </option>

                    <option value="BCA">
                        BCA
                    </option>

                    <option value="MCA">
                        MCA
                    </option>

                </select>


                <!-- SEMESTER -->
                <label for="semester">
                    Semester
                </label>

                <select
                    id="semester"
                    name="semester"
                    required
                >

                    <option value="">
                        Select Semester
                    </option>

                    <option value="1">
                        Semester 1
                    </option>

                    <option value="2">
                        Semester 2
                    </option>

                    <option value="3">
                        Semester 3
                    </option>

                    <option value="4">
                        Semester 4
                    </option>

                    <option value="5">
                        Semester 5
                    </option>

                    <option value="6">
                        Semester 6
                    </option>

                    <option value="7">
                        Semester 7
                    </option>

                    <option value="8">
                        Semester 8
                    </option>

                </select>


                <!-- MESSAGE -->
                <label for="message">
                    Message
                </label>

                <textarea
                    id="message"
                    name="message"
                    rows="4"
                    placeholder="Enter your message"
                ></textarea>


                <!-- BUTTON -->
                <button
                    type="submit"
                >
                    Submit Registration
                </button>

                <button
                    type="reset"
                    style="margin-left:10px;"
                >
                    Clear
                </button>

            </form>

        </section>

    </main>


    <!-- FOOTER -->
    <footer>

        <p>
            © 2026 StudentHub Portal
        </p>

    </footer>

</body>

</html>
